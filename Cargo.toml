[package]
name = "herdr-flash"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Herdr plugin: flash-style scrollback selection and copy"

[[bin]]
name = "herdr-flash"
path = "src/main.rs"

[dependencies]
ansi-to-tui = "8.0.1"
arboard = "3.6.1"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
